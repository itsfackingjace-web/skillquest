<!doctype html><html><head><meta charset="utf-8"><title>SkillQuest sign-in</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1e3a24;font:18px/1.5 system-ui,sans-serif;color:#f8f0d8}
.b{background:#f8f0d8;color:#404040;border:4px solid #384870;padding:28px 34px;max-width:420px;text-align:center}h1{font-size:22px;margin:0 0 8px;color:#3058c8}</style></head>
<body><div class="b"><h1 id="t">Signing you in...</h1><div id="m">One moment.</div></div>
<script>
(async()=>{const q=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);
 const t=document.getElementById('t'),m=document.getElementById('m');
 try{const r=await fetch('/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({st:q.get('st'),idToken:q.get('id_token'),error:q.get('error')})});const j=await r.json();
  if(j.ok){t.textContent='You’re signed in!';m.textContent='Go back to the SkillQuest app. You can close this tab.'}else{t.textContent='Sign-in didn’t finish';m.textContent='Go back to SkillQuest and try Sign in again.'}}
 catch(e){t.textContent='Sign-in didn’t finish';m.textContent='The SkillQuest app wasn’t listening any more. Try Sign in again from the app.'}})();
</script></body></html>
